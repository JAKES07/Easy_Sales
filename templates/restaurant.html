<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant - Easy_Sales</title><style>
body{font-family:Arial;margin:0;background:#f3f4f6;color:#20252b}.top{background:#20252b;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.wrap{max-width:1100px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button,.btn{border:0;border-radius:8px;padding:11px 14px;background:#20252b;color:#fff;cursor:pointer}.tabs button.active{background:#16803c}.panel{display:none;background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0001}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #ddd;border-radius:10px;padding:13px;background:#fff}.muted{color:#666;font-size:13px}.input{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 10px;border:1px solid #ccc;border-radius:7px}.menu-item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #ddd;padding:10px;border-radius:8px;margin:6px 0}.danger{background:#a72a2a}.green{color:#16803c}.red{color:#a72a2a}.stat{font-size:25px;font-weight:700}.order{border-left:5px solid #16803c}.small{font-size:12px}.recipe-row{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;margin:5px 0}
</style></head><body><div class="top"><strong>🍔 Easy_Sales Restaurant</strong><span>Store: {{store_id}}</span></div><div class="wrap"><div class="tabs"><button data-tab="pos" class="active">Restaurant POS</button><button data-tab="menu">Menu</button><button data-tab="orders">Orders</button><button data-tab="reports">Reports</button><a class="btn" href="{{url_for('restaurant.kitchen_page')}}">Kitchen Screen</a><a class="btn" href="{{url_for('restaurant.customer_page', store_id=store_id)}}" target="_blank">📱 Customer Online</a><button class="btn green" type="button" onclick="shareCustomerOrdering()">📲 Share Online Ordering</button></div>
<section id="pos" class="panel active"><h2>Restaurant POS</h2><div class="grid"><div><div id="posMenu"></div></div><div class="card"><h3>Current Order</h3><div id="cart"></div><strong>Total: <span id="cartTotal">R0.00</span></strong><div style="margin-top:12px"><input id="customerName" class="input" placeholder="Customer name (optional)"><button class="btn" id="placePos">Create Order</button></div></div></div></section>
<section id="menu" class="panel"><h2>Menu</h2><form id="menuForm" class="card"><input id="mName" class="input" placeholder="Menu item name" required><input id="mCat" class="input" placeholder="Category" value="Burgers"><input id="mPrice" class="input" type="number" step="0.01" min="0" placeholder="Selling price" required><button class="btn">Save Menu Item</button></form><div id="menuList" style="margin-top:14px"></div></section>

<section id="orders" class="panel"><h2>Restaurant Orders</h2><div id="ordersList"></div></section>
<section id="reports" class="panel"><h2>Restaurant Performance</h2><div id="reportBox"></div></section></div><script>
const STORE={{store_id|tojson}}, money=v=>'R'+Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}); let data={ingredients:[],menus:[]},cart=[];
async function api(url,opt={}){opt.headers={'Content-Type':'application/json',...(opt.headers||{})}; const r=await fetch(url,opt); const j=await r.json(); if(!j.success)throw Error(j.message||'Request failed'); return j}
function show(tab){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===tab));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab)); if(tab==='orders')loadOrders();if(tab==='reports')loadReport()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
async function load(){data=await api('/api/restaurant/bootstrap?store_id='+encodeURIComponent(STORE)); renderAll()}
function renderAll(){renderMenus();renderPOS()}
function renderMenus(){document.getElementById('menuList').innerHTML=data.menus.map(m=>`<div class="card"><strong>${esc(m.name)}</strong> <span class="muted">${esc(m.category)}</span><div>Sell: ${money(m.selling_price)} | Ingredient cost: ${money(m.ingredient_cost)} | <span class="${m.gross_profit<0?'red':'green'}">Est. profit: ${money(m.gross_profit)}</span></div></div>`).join('')||'<p class="muted">No menu items yet.</p>'}
function renderPOS(){document.getElementById('posMenu').innerHTML=data.menus.map(m=>`<button class="btn" style="margin:4px" onclick="addCart(${m.id})">${esc(m.name)}<br>${money(m.selling_price)}</button>`).join('')||'<p class="muted">Create menu items first.</p>';document.getElementById('cart').innerHTML=cart.map((x,n)=>`<div class="menu-item"><span>${esc(x.name)} × ${x.qty}</span><span>${money(x.qty*x.price)} <button class="btn danger" onclick="cart.splice(${n},1);renderPOS()">×</button></span></div>`).join('')||'<p class="muted">No items.</p>';document.getElementById('cartTotal').textContent=money(cart.reduce((a,x)=>a+x.qty*x.price,0))}
function addCart(id){const m=data.menus.find(x=>x.id===id);let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id:m.id,name:m.name,price:m.selling_price,qty:1});renderPOS()}
document.getElementById('placePos').onclick=async()=>{if(!cart.length)return alert('Add food first.');const j=await api('/api/restaurant/orders',{method:'POST',body:JSON.stringify({store_id:STORE,source:'POS',customer_name:document.getElementById('customerName').value,items:cart.map(x=>({menu_id:x.id,quantity:x.qty}))})});alert('Order '+j.order_number+' created. Pay the order in the Orders tab.');cart=[];document.getElementById('customerName').value='';renderPOS();show('orders');loadOrders()}
document.getElementById('menuForm').onsubmit=async e=>{e.preventDefault();await api('/api/restaurant/menu',{method:'POST',body:JSON.stringify({store_id:STORE,name:mName.value,category:mCat.value,selling_price:mPrice.value,recipe:[]})});e.target.reset();mCat.value='Burgers';await load()}
async function loadOrders(){const j=await api('/api/restaurant/orders?store_id='+STORE);document.getElementById('ordersList').innerHTML=j.orders.map(o=>`<div class="card order"><strong>${esc(o.order_number)}</strong> <span class="small">${esc(o.source)}</span><div>${o.items.map(i=>esc(i.product_name)+' × '+i.quantity).join('<br>')}</div><strong>${money(o.total)}</strong><div>Status: <strong>${esc(o.status)}</strong></div>${o.status==='PENDING_PAYMENT'?`<button class="btn" onclick="pay(${o.id})">Mark Paid</button>`:''}${o.status==='PAID'?`<button class="btn" onclick="st(${o.id},'ACCEPTED')">Send to Kitchen</button>`:''}</div>`).join('')||'<p class="muted">No orders.</p>'}
async function pay(id){await api('/api/restaurant/orders/'+id+'/pay',{method:'POST',body:JSON.stringify({store_id:STORE,payment_method:prompt('Payment method','CASH')||'CASH'})});loadOrders()}
async function st(id,status){await api('/api/restaurant/orders/'+id+'/status',{method:'POST',body:JSON.stringify({store_id:STORE,status})});loadOrders()}
async function addExpense(){const n=document.getElementById('expName').value.trim(),a=Number(document.getElementById('expAmount').value);if(!n||a<0)return alert('Enter a valid expense.');await api('/api/restaurant/expenses',{method:'POST',body:JSON.stringify({store_id:STORE,name:n,amount:a})});document.getElementById('expName').value='';document.getElementById('expAmount').value='';loadReport()}
async function loadReport(){const j=await api('/api/restaurant/report?store_id='+STORE);const best=(j.items||[]).slice(0,5);document.getElementById('reportBox').innerHTML=`<div class="grid"><div class="card"><div class="muted">Revenue</div><div class="stat">${money(j.revenue)}</div></div><div class="card"><div class="muted">Orders</div><div class="stat">${j.orders}</div></div><div class="card"><div class="muted">Expenses</div><div class="stat">${money(j.expenses)}</div></div></div><div class="card"><h3>Best Sellers</h3>${best.length?best.map((x,i)=>`<div class="menu-item"><span><strong>#${i+1}</strong> ${esc(x.product_name)}</span><strong>${x.quantity_sold} sold</strong></div>`).join(''):'<p class="muted">No sales yet.</p>'}</div><div class="card"><h3>Add Restaurant Expense</h3><div class="grid"><input id="expName" class="input" placeholder="Expense name e.g. Electricity"><input id="expAmount" class="input" type="number" step="0.01" min="0" placeholder="Amount"></div><button class="btn" onclick="addExpense()">Save Expense</button></div><h3>Product Performance</h3>${(j.items||[]).map(x=>`<div class="card"><strong>${esc(x.product_name)}</strong> — ${x.quantity_sold} sold<br>Revenue ${money(x.revenue)} | Estimated ingredient cost ${money(x.estimated_cost)} | <strong>Estimated profit ${money(x.estimated_profit)}</strong></div>`).join('')||'<p class="muted">No product sales yet.</p>'}`}
function shareCustomerOrdering(){const url=window.location.origin+'/r/'+encodeURIComponent(STORE);const text='Order online from Easy_Sales Restaurant: '+url;const wa='https://wa.me/?text='+encodeURIComponent(text);window.location.href=wa}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} load();
</script></body></html>
