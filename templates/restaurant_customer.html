<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order - Easy_Sales Restaurant</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;color:#20252b}.wrap{max-width:700px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:17px;margin:10px 0;box-shadow:0 2px 9px #0001}.brand{text-align:center}.brand img{width:100px;height:100px;object-fit:contain}.brand h1{font-size:28px;margin:5px 0 8px}.btn{padding:13px 15px;border:0;border-radius:12px;background:#20252b;color:#fff;cursor:pointer;font-weight:800}.btn.green{background:#16803c}.share-row{display:flex;gap:8px}.share-row .btn{width:100%}.food{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #ddd;border-radius:14px;padding:13px;margin:8px 0;background:#fff}.food-info{display:flex;align-items:center;gap:10px}.food-emoji{font-size:27px}.food-name{font-size:18px;font-weight:800}.food-price{color:#16803c;font-weight:800;margin-top:3px}.add{min-width:76px}.category{font-size:22px;margin:20px 0 8px;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;background:#f7f8f9}.category .cat-emoji{font-size:29px}.category-empty{font-size:13px;color:#777;padding:0 10px 8px}.category:first-child{margin-top:0}.category-count{font-size:12px;color:#16803c;background:#eefaf2;border-radius:999px;padding:5px 9px}.small{font-size:13px;color:#666}.input{padding:12px;border:1px solid #ccc;border-radius:10px;width:100%;box-sizing:border-box;margin-bottom:10px}.cart-line{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0}.total{font-size:21px;font-weight:800}.status{display:none;border:2px solid #16803c;background:#eefaf2}.ready{font-size:24px;font-weight:900}.receipt-row{margin-top:12px}.notice{padding:10px;border-radius:10px;background:#fff4d6;color:#684e00;margin-top:10px}
</style></head><body><div class="wrap">
<div class="card brand"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="Easy_Sales"><h1>🍔 {{store['store_name']}}</h1><p>Order ahead and pay at the cashier when you arrive.</p><div class="share-row"><button class="btn green" id="sharePage">📲 Share Ordering via WhatsApp</button></div><p class="small">Share this restaurant with friends and family so they can order from their phone.</p></div>
<div class="card"><h2>📋 Menu</h2><div id="menu"></div></div>
<div class="card"><h2>🛒 Your Order</h2><input id="name" class="input" placeholder="Name (optional)"><div id="cart"></div><p class="total">Total: <span id="total">R0.00</span></p><button class="btn green" id="send">PLACE ORDER — PAY AT CASHIER</button></div>
<div id="statusCard" class="card status" aria-live="polite"><div class="ready" id="statusTitle">Order status</div><div id="statusMessage">Waiting for an update...</div><div class="small" id="statusNumber"></div></div><div id="result"></div>
</div>
<script>
const STORE={{store_id|tojson}};const CUSTOMER_URL=window.location.origin+'/r/'+encodeURIComponent(STORE);const STORAGE_KEY='easy_sales_customer_order_'+STORE;let menus=[],categories=[],cart=[],trackingToken=null,lastStatus=null,statusTimer=null;
function saveCustomerState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({cart,trackingToken,lastStatus,customerName:document.getElementById('name')?.value||''}))}catch(e){console.warn('Could not save order state',e)}}
function restoreCustomerState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const st=JSON.parse(raw)||{};cart=Array.isArray(st.cart)?st.cart:[];trackingToken=st.trackingToken||null;lastStatus=st.lastStatus||null;if(document.getElementById('name'))document.getElementById('name').value=st.customerName||''}catch(e){console.warn('Could not restore order state',e)}}
function clearCustomerState(){try{localStorage.removeItem(STORAGE_KEY)}catch(e){}}const money=v=>'R'+Number(v||0).toFixed(2);const categoryEmoji={russian:'🌭',burger:'🍔',fish:'🐟',quta:'🥪',chicken:'🍗',chips:'🍟',meals:'🍽️',ribs:'🍖',pork:'🥩',beef:'🥩',pap:'🥣',rice:'🍚',salad:'🥗','ice cream':'🍦'};function catEmoji(c){const k=String(c||'').trim().toLowerCase();const found=categories.find(x=>String(x.name).trim().toLowerCase()===k);return found?found.emoji:(categoryEmoji[k]||'🍽️')}
async function load(){try{const r=await fetch('/api/restaurant/bootstrap?store_id='+encodeURIComponent(STORE),{cache:'no-store'});const j=await r.json();if(!r.ok||!j.success)throw Error(j.message||'Menu could not be loaded.');categories=j.categories||[];menus=j.menus||[];restoreCustomerState();renderMenu();render();if(trackingToken){await pollStatus();if(statusTimer)clearInterval(statusTimer);statusTimer=setInterval(pollStatus,5000)}}catch(e){document.getElementById('menu').innerHTML='<p>⚠️ '+esc(e.message)+'</p>'}}
function grouped(){const g={};categories.forEach(c=>g[c.name]=[]);menus.forEach(m=>{const c=(m.category||'General').trim()||'General';(g[c]??=[]).push(m)});return Object.fromEntries(Object.entries(g).filter(([cat,items])=>items.length>0))}
function renderMenu(){const groups=grouped();document.getElementById('menu').innerHTML=Object.entries(groups).map(([cat,items])=>`<div class="category"><span class="cat-emoji">${catEmoji(cat)}</span><strong>${esc(cat)}</strong><span class="category-count">${items.length} item${items.length===1?'':'s'}</span></div>${items.map(m=>`<div class="food"><div class="food-info"><span class="food-emoji">${catEmoji(cat)}</span><div><div class="food-name">${esc(m.name)}</div><div class="food-price">${money(m.selling_price)}</div></div></div><button class="btn add" onclick="add(${m.id})">ADD</button></div>`).join('')}${items.length?'':'<div class="category-empty">No products yet.</div>'}`).join('')||'<p>No categories are available.</p>'}
function add(id){let m=menus.find(x=>x.id===id),x=cart.find(x=>x.id===id);if(!m)return;if(x)x.qty++;else cart.push({id:m.id,name:m.name,price:m.selling_price,qty:1});render();saveCustomerState()}
function render(){document.getElementById('cart').innerHTML=cart.map((x,i)=>`<div class="cart-line"><span>${esc(x.name)} × ${x.qty}</span><span>${money(x.qty*x.price)} <button class="btn" onclick="cart.splice(${i},1);render()">−</button></span></div>`).join('')||'<p class="small">No items yet.</p>';document.getElementById('total').textContent=money(cart.reduce((a,x)=>a+x.qty*x.price,0))}
function shareOrderingPage(){const text=`🍔 Order online from ${escPlain({{store['store_name']|tojson}})}: ${CUSTOMER_URL}`;window.location.href='https://wa.me/?text='+encodeURIComponent(text)}
document.getElementById('sharePage').onclick=shareOrderingPage;document.getElementById('name').addEventListener('input',saveCustomerState);
async function downloadReceipt(token){try{const r=await fetch('/api/restaurant/online-order/receipt?store_id='+encodeURIComponent(STORE)+'&token='+encodeURIComponent(token),{cache:'no-store'});if(!r.ok)throw Error('Receipt could not be created.');const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Easy_Sales_Online_Order_Receipt.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){console.error('Receipt download error',e)}}
function showStatus(order,message){const card=document.getElementById('statusCard');card.style.display='block';document.getElementById('statusNumber').textContent='Order '+order.order_number;const title=document.getElementById('statusTitle');title.textContent=order.status==='READY'?'🎉 Your food is ready!':'Order status: '+order.status;title.className=order.status==='READY'?'ready':'';document.getElementById('statusMessage').textContent=message;if(order.status==='READY'&&lastStatus!=='READY'){try{if(navigator.vibrate)navigator.vibrate([250,120,250])}catch(e){}alert('🎉 Your food is ready! Please collect order '+order.order_number+'.')}lastStatus=order.status;saveCustomerState()}
async function pollStatus(){if(!trackingToken)return;try{const r=await fetch('/api/restaurant/online-order/status?store_id='+encodeURIComponent(STORE)+'&token='+encodeURIComponent(trackingToken)+'&t='+Date.now(),{cache:'no-store'});const j=await r.json();if(r.ok&&j.success){showStatus(j.order,j.message);if(['COLLECTED','CANCELLED'].includes(j.order.status)){clearInterval(statusTimer);statusTimer=null}}}catch(e){console.error('Order status error',e)}}
async function placeOrder(){if(!cart.length)return alert('Choose something first.');const button=document.getElementById('send');button.disabled=true;button.textContent='PLACING ORDER...';try{const r=await fetch('/api/restaurant/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({store_id:STORE,source:'ONLINE',customer_name:document.getElementById('name').value,items:cart.map(x=>({menu_id:x.id,quantity:x.qty}))})});const j=await r.json();if(!r.ok||!j.success)throw Error(j.message||'Could not place order.');trackingToken=j.customer_token;lastStatus=null;saveCustomerState();document.getElementById('result').innerHTML=`<div class="card"><h2>✅ Order received</h2><h1>${esc(j.order_number)}</h1><p>Total: <b>${money(j.total)}</b></p><p>Pay at the cashier. Keep this page open for live order updates.</p><div class="receipt-row"><button class="btn green" id="receiptBtn">📄 Download PDF Receipt</button></div><div class="notice">🔔 Keep this page open. You will be alerted here when your food is ready.</div></div>`;document.getElementById('receiptBtn').onclick=()=>downloadReceipt(trackingToken);cart=[];render();saveCustomerState();await downloadReceipt(trackingToken);await pollStatus();if(statusTimer)clearInterval(statusTimer);statusTimer=setInterval(pollStatus,5000)}catch(e){alert(e.message)}finally{button.disabled=false;button.textContent='PLACE ORDER — PAY AT CASHIER'}}
document.getElementById('send').onclick=placeOrder;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escPlain(s){return String(s??'')}load();render();
</script></body></html>
