<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order - Easy_Sales Restaurant</title><style>body{font-family:Arial;background:#f3f4f6;margin:0}.wrap{max-width:700px;margin:auto;padding:16px}.card{background:#fff;border-radius:12px;padding:15px;margin:10px 0}.btn{padding:12px;border:0;border-radius:8px;background:#20252b;color:#fff}.food{display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd;border-radius:8px;padding:12px;margin:7px 0}input{padding:11px;border:1px solid #ccc;border-radius:7px;width:100%;box-sizing:border-box}</style></head><body><div class="wrap"><div class="card"><h1>🍔 {{store['store_name']}}</h1><p>Order ahead and pay at the cashier when you arrive.</p></div><div class="card"><h2>Menu</h2><div id="menu"></div></div><div class="card"><h2>Your order</h2><input id="name" placeholder="Name (optional)"><div id="cart"></div><h3>Total: <span id="total">R0.00</span></h3><button class="btn" id="send">PLACE ORDER — PAY AT CASHIER</button></div><div id="result"></div></div><script>const STORE={{store_id|tojson}};let menus=[],cart=[];const money=v=>'R'+Number(v||0).toFixed(2);async function load(){const r=await fetch('/api/restaurant/bootstrap?store_id='+STORE);const j=await r.json();menus=j.menus;document.getElementById('menu').innerHTML=menus.map(m=>`<div class="food"><span><b>${m.name}</b><br>${m.category}<br>${money(m.selling_price)}</span><button class="btn" onclick="add(${m.id})">ADD</button></div>`).join('')}function add(id){let m=menus.find(x=>x.id===id),x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id:m.id,name:m.name,price:m.selling_price,qty:1});render()}function render(){document.getElementById('cart').innerHTML=cart.map(x=>`<div>${x.name} × ${x.qty} — ${money(x.qty*x.price)}</div>`).join('')||'No items yet';document.getElementById('total').textContent=money(cart.reduce((a,x)=>a+x.qty*x.price,0))}document.getElementById('send').onclick=async()=>{if(!cart.length)return alert('Choose something first.');const r=await fetch('/api/restaurant/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({store_id:STORE,source:'ONLINE',customer_name:document.getElementById('name').value,items:cart.map(x=>({menu_id:x.id,quantity:x.qty}))})});const j=await r.json();if(!j.success)return alert(j.message);document.getElementById('result').innerHTML=`<div class="card"><h2>Order received</h2><h1>${j.order_number}</h1><p>Total: <b>${money(j.total)}</b></p><p>Show this order number at the cashier and pay. Your order will then be sent to the restaurant.</p></div>`;cart=[];render()};load()</script></body></html>
