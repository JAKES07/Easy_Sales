<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="20"><title>Kitchen - Easy_Sales</title><style>body{font-family:Arial;margin:0;background:#20252b;color:#fff}.wrap{padding:16px;max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:#fff;color:#222;border-radius:12px;padding:15px}.new{border-top:7px solid #a72a2a}.paid{border-top:7px solid #16803c}.btn{padding:12px;border:0;border-radius:8px;background:#20252b;color:#fff;margin:5px 0}</style></head><body><div class="wrap"><h1>🍔 Restaurant Kitchen</h1><div id="orders" class="grid"></div></div><script>const STORE={{store_id|tojson}};async function load(){const r=await fetch('/api/restaurant/orders?store_id='+STORE);const j=await r.json();document.getElementById('orders').innerHTML=j.orders.filter(o=>['PAID','ACCEPTED','PREPARING','READY'].includes(o.status)).map(o=>`<div class="card ${o.status==='PAID'?'new':'paid'}"><h2>${o.order_number}</h2><h3>${o.status}</h3>${o.items.map(i=>`<div>${i.product_name} × ${i.quantity}</div>`).join('')}<p>${o.customer_name||''}</p>${o.status==='PAID'?`<button class="btn" onclick="st(${o.id},'ACCEPTED')">ACCEPT</button>`:''}${o.status==='ACCEPTED'?`<button class="btn" onclick="st(${o.id},'PREPARING')">PREPARING</button>`:''}${o.status==='PREPARING'?`<button class="btn" onclick="st(${o.id},'READY')">READY</button>`:''}${o.status==='READY'?`<button class="btn" onclick="st(${o.id},'COLLECTED')">COLLECTED</button>`:''}</div>`).join('')||'<div class="card">No active orders.</div>'}async function st(id,status){await fetch('/api/restaurant/orders/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({store_id:STORE,status})});load()}load()</script></body></html>
