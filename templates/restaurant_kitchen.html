<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen - Easy_Sales</title><style>body{font-family:Arial;margin:0;background:#20252b;color:#fff}.wrap{padding:16px;max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:#fff;color:#222;border-radius:12px;padding:15px}.new{border-top:7px solid #a72a2a}.paid{border-top:7px solid #16803c}.btn{padding:12px;border:0;border-radius:8px;background:#20252b;color:#fff;margin:5px 0;font-weight:700}.error{background:#ffe6e6;color:#8a1111;border-radius:10px;padding:12px}</style></head><body><div class="wrap"><h1>🍔 Restaurant Kitchen</h1><p>Store: <strong>{{store_id}}</strong> • This screen can stay open on a separate kitchen device.</p><div id="message"></div><div id="orders" class="grid"></div></div><script>const STORE={{store_id|tojson}}, TOKEN={{kitchen_token|tojson}};let loading=false;async function load(){if(loading)return;loading=true;try{const r=await fetch('/api/restaurant/kitchen/orders?store_id='+encodeURIComponent(STORE)+'&token='+encodeURIComponent(TOKEN),{cache:'no-store'});const j=await r.json();if(!r.ok||!j.success)throw Error(j.message||'Kitchen access failed.');document.getElementById('message').innerHTML='';document.getElementById('orders').innerHTML=j.orders.filter(o=>['PAID','ACCEPTED','PREPARING','READY'].includes(o.status)).map(o=>`<div class="card ${o.status==='PAID'?'new':'paid'}"><h2>${o.order_number}</h2><h3>${o.status}</h3>${o.items.map(i=>`<div>${i.product_name} × ${i.quantity}</div>`).join('')}<p>${o.customer_name||''}</p>${o.status==='PAID'?`<button class="btn" onclick="st(${o.id},'ACCEPTED')">ACCEPT</button>`:''}${o.status==='ACCEPTED'?`<button class="btn" onclick="st(${o.id},'PREPARING')">PREPARING</button>`:''}${o.status==='PREPARING'?`<button class="btn" onclick="st(${o.id},'READY')">READY</button>`:''}${o.status==='READY'?`<button class="btn" onclick="st(${o.id},'COLLECTED')">COLLECTED</button>`:''}</div>`).join('')||'<div class="card">No active orders.</div>'}catch(e){document.getElementById('message').innerHTML='<div class="error">'+e.message+'</div>'}finally{loading=false}}async function st(id,status){try{const r=await fetch('/api/restaurant/kitchen/orders/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({store_id:STORE,token:TOKEN,status})});const j=await r.json();if(!r.ok||!j.success)throw Error(j.message||'Could not update order.');load()}catch(e){alert(e.message)}}load();setInterval(load,5000);</script></body></html>
