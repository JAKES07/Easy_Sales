<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Sales - Store Access</title>

    <!-- The main Easy Sales stylesheet is reused so the new page fits the app. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f1f1f1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .access-card {
            width: min(420px, calc(100% - 32px));
            background: white;
            border-radius: 18px;
            padding: 32px 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            max-width: 180px;
            max-height: 100px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        h1 {
            margin: 8px 0;
            color: #222;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin: 0 0 26px;
            line-height: 1.5;
        }

        .field {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #444;
        }

        .access-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }

        .access-button:active {
            transform: scale(0.99);
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            line-height: 1.4;
        }

        .message.error {
            background: #ffe5e5;
            color: #9b1c1c;
        }

        .message.success {
            background: #e3f7e8;
            color: #176b2c;
        }

        .footer-note {
            margin-top: 22px;
            font-size: 12px;
            color: #888;
        }

        /* Easy Sales WhatsApp + TikTok popup */
        .social-popup-overlay {
            position: fixed; inset: 0; z-index: 99999;
            display: none; align-items: center; justify-content: center;
            padding: 18px; background: rgba(0,0,0,.58);
        }
        .social-popup-overlay.show { display: flex; }
        .social-popup {
            width: min(390px, 100%); background:#fff; border-radius:22px;
            padding:28px 22px 22px; text-align:center; position:relative;
            box-shadow:0 20px 60px rgba(0,0,0,.30);
        }
        .social-popup-close {
            position:absolute; top:10px; right:10px; width:38px; height:38px;
            margin:0; padding:0; border:0; border-radius:50%;
            background:#f0f0f0; color:#222; font-size:24px; cursor:pointer;
        }
        .social-popup-icon { font-size:42px; margin-bottom:5px; }
        .social-popup h2 { margin:0 0 8px; color:#222; font-size:24px; }
        .social-popup p { margin:0 0 18px; color:#666; line-height:1.45; }
        .social-popup-link {
            display:block; width:100%; padding:14px 16px; margin:10px 0 0;
            border-radius:11px; text-decoration:none; font-weight:bold;
            font-size:16px; box-sizing:border-box;
        }
        .social-popup-whatsapp { background:#25D366; color:#fff; }
        .social-popup-tiktok { background:#111; color:#fff; }
        .social-popup-later {
            display:inline-block; width:auto; margin-top:12px; padding:7px 12px;
            border:0; background:transparent; color:#777; font-size:13px; cursor:pointer;
        }
    </style>
</head>

<body>
    <main class="access-card">
        <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            alt="Easy Sales"
            class="logo"
            onerror="this.style.display='none'"
        >

        <h1>Store Access</h1>
        <p class="subtitle">
            Enter your Store ID and passkey to access your Easy Sales store.
        </p>

        <form id="accessForm" method="POST">
            <div class="field">
                <label for="store_id">Store ID</label>
                <input
                    type="text"
                    id="store_id"
                    name="store_id"
                    placeholder="Example: STORE001"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="passkey">Passkey</label>
                <input
                    type="password"
                    id="passkey"
                    name="passkey"
                    placeholder="Enter your passkey"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="access-button">Enter Store</button>
        </form>

        <!-- This area is ready for messages from the controller.
             We will connect the backend route in the next integration step. -->
        <div id="message" class="message" role="alert"></div>

        <p class="footer-note">
            Easy Sales • Secure Store Access
        </p>
    </main>

    <script>
        /*
         * Visual validation only for now.
         * The real security check stays on the server in store_access.py.
         */
        const form = document.getElementById("accessForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function (event) {
            const storeId = document.getElementById("store_id").value.trim();
            const passkey = document.getElementById("passkey").value.trim();

            if (!storeId || !passkey) {
                event.preventDefault();
                message.textContent = "Please enter both your Store ID and passkey.";
                message.className = "message error";
                message.style.display = "block";
            }
        });
    </script>

    <!-- Easy Sales WhatsApp + TikTok popup -->
    <div id="easy-sales-social-popup" class="social-popup-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="social-popup">
            <button type="button" class="social-popup-close" id="social-popup-close" aria-label="Close">&times;</button>
            <div class="social-popup-icon">👋</div>
            <h2>Need Help?</h2>
            <p>Connect with Easy Sales for support, updates and more.</p>
            <a class="social-popup-link social-popup-whatsapp" target="_blank" rel="noopener" href="https://wa.me/27729288696?text=Hi%20Easy%20Sales%2C%20I%20need%20help%20with%20my%20store.">💬 WhatsApp Easy Sales</a>
            <a class="social-popup-link social-popup-tiktok" target="_blank" rel="noopener" href="https://www.tiktok.com/@easysales109">🎵 Follow Easy Sales on TikTok</a>
            <button type="button" class="social-popup-later" id="social-popup-later">Maybe later</button>
        </div>
    </div>

    <script>
        (function () {
            function initSocialPopup() {
                const popup = document.getElementById("easy-sales-social-popup");
                const close = document.getElementById("social-popup-close");
                const later = document.getElementById("social-popup-later");
                if (!popup) return;
                function hide() { popup.classList.remove("show"); popup.setAttribute("aria-hidden", "true"); }
                function show() { popup.classList.add("show"); popup.setAttribute("aria-hidden", "false"); }
                close && close.addEventListener("click", hide);
                later && later.addEventListener("click", hide);
                popup.addEventListener("click", function(e){ if(e.target === popup) hide(); });
                document.addEventListener("keydown", function(e){ if(e.key === "Escape") hide(); });
                window.setTimeout(show, 700);
            }
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initSocialPopup);
            else initSocialPopup();
        })();
    </script>
</body>
</html>
