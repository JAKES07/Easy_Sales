<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Sales - Store Access</title>

    <!-- The main Easy Sales stylesheet is reused so the new page fits the app. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f1f1f1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .access-card {
            width: min(420px, calc(100% - 32px));
            background: white;
            border-radius: 18px;
            padding: 32px 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            max-width: 180px;
            max-height: 100px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        h1 {
            margin: 8px 0;
            color: #222;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin: 0 0 26px;
            line-height: 1.5;
        }

        .field {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #444;
        }

        .access-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }

        .access-button:active {
            transform: scale(0.99);
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            line-height: 1.4;
        }

        .message.error {
            background: #ffe5e5;
            color: #9b1c1c;
        }

        .message.success {
            background: #e3f7e8;
            color: #176b2c;
        }

        .footer-note {
            margin-top: 22px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>
    <main class="access-card">
        <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            alt="Easy Sales"
            class="logo"
            onerror="this.style.display='none'"
        >

        <h1>Store Access</h1>
        <p class="subtitle">
            Enter your Store ID and passkey to access your Easy Sales store.
        </p>

        <form id="accessForm" method="POST">
            <div class="field">
                <label for="store_id">Store ID</label>
                <input
                    type="text"
                    id="store_id"
                    name="store_id"
                    placeholder="Example: STORE001"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="passkey">Passkey</label>
                <input
                    type="password"
                    id="passkey"
                    name="passkey"
                    placeholder="Enter your passkey"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="access-button">Enter Store</button>
        </form>

        <!-- This area is ready for messages from the controller.
             We will connect the backend route in the next integration step. -->
        <div id="message" class="message" role="alert"></div>

        <p class="footer-note">
            Easy Sales • Secure Store Access
        </p>
    </main>

    <script>
        /*
         * Visual validation only for now.
         * The real security check stays on the server in store_access.py.
         */
        const form = document.getElementById("accessForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function (event) {
            const storeId = document.getElementById("store_id").value.trim();
            const passkey = document.getElementById("passkey").value.trim();

            if (!storeId || !passkey) {
                event.preventDefault();
                message.textContent = "Please enter both your Store ID and passkey.";
                message.className = "message error";
                message.style.display = "block";
            }
        });
    </script>
</body>
</html>
